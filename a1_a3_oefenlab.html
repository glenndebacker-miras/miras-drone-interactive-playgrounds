:15px;margin-bottom:25px}.questiontop .eyebrow{margin:0}.flag{font-size:12px;min-height:36px;padding:7px 10px}.flag.on{background:#ffe4bd;border-color:var(--orange)}.question h2{font-size:25px;min-height:66px}.options{display:grid;gap:12px;margin-top:25px}.option{display:flex;align-items:center;gap:15px;text-align:left;font-weight:450;border-color:#e2d7ce;padding:15px}.letter{display:grid;place-content:center;border:1px solid #ded3ca;border-radius:7px;width:32px;height:32px;flex:none;font-size:14px;font-weight:700}.option.selected{border:2px solid var(--orange);background:var(--soft);padding:14px}.selected .letter{background:var(--orange);color:white;border-color:var(--orange)}.option.good{border:2px solid var(--green);background:#eef8f3;padding:14px}.option.bad{border:2px solid var(--red);background:#fff0e9;padding:14px}.option:disabled{opacity:1}.nav{display:flex;justify-content:space-between;gap:10px;margin-top:28px;padding-top:20px;border-top:1px solid var(--line)}aside.card{padding:22px;height:fit-content}.progress{height:5px;border-radius:5px;background:#f1e6dc;overflow:hidden;margin:13px 0}.progress i{display:block;background:var(--orange);height:100%}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:20px 0}.grid button{padding:0;min-height:36px;font-size:13px;position:relative;border-radius:7px}.grid .answered{background:#fce4d0;border-color:#dfb89b}.grid .current{outline:2px solid var(--orange);outline-offset:1px}.grid .marked:after{content:'•';position:absolute;right:2px;top:-8px;color:var(--orange);font-size:21px}.feedback{margin-top:20px;padding:17px 20px;border-left:3px solid var(--green);border-radius:0 10px 10px 0;background:#f0f7f3}.feedback.wrong{border-color:var(--red);background:#fff3e9}.feedback p{margin:7px 0}.feedback a{font-size:13px}.resultshero{display:flex;align-items:center;gap:28px;margin-bottom:25px}.resultshero h1{font-size:37px}.score{flex:none;width:130px;height:130px;display:grid;place-content:center;text-align:ce .banktools{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.banktools button{font-size:13px}@media(max-width:780px){header{align-items:flex-start;gap:15px;flex-wrap:wrap}.banktools{width:100%;justify-content:space-between}}</style></head><body><header><a href="#" id="homeLogo"><span class="logo">✣</span><span>A1/A3 <b>Oefenlab</b><small>DRONES · CATEGORIE OPEN</small></span></a><div class="banktools"><span id="bankStatus" class="small muted">Vragen laden…</span></div></header><main id="app"><p>Vragen laden…</p></main><footer><span>Zelfstandig oefenen · Geen officiële examenvragen · Cursusversie 01/12/2025</span><button id="about">Over deze oefenapp</button></footer><dialog id="dialog"><div id="dialogBody"></div><button id="close">Terug</button></dialog><script>'use strict';
const modules=['Luchtveiligheid','Luchtruimbeperkingen','Luchtvaartregelgeving','Menselijke prestaties','Operationele procedures','UAS algemene kennis','Privacy & gegevens','Verzekering','Beveiliging'];
const quotas=[7,4,6,4,6,6,3,2,2],KEY='a1a3-session-json-v1',HKEY='a1a3-history-json-v1';
const $=id=>document.getElementById(id),app=$('app');let bank=[],session=null,history=[],filter='all';
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function read(k){try{return JSON.parse(localStorage.getItem(k))}catch{return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(session));localStorage.setItem(HKEY,JSON.stringify(history))}catch{if(!$('storageNotice')){const p=document.createElement('p');p.id='storageNotice';p.className='notice';p.textContent='Je browser kan de voortgang niet bewaren. Houd de pagina open.';app.prepend(p)}}}
function modal(html){$('dialogBody').innerHTML=html;$('dialog').showModal()}
$('close').onclick=()=>$('dialog').close();$('homeLogo').onclick=e=>{e.preventDefault();bank.length?home():loadQuestions()};
$('about').onclick=()=>modal(`<h2>Over deze oefenapp</h2><p>${bank.length} zelfgeschreven vragen op basis van de BCAA-cursus A1/A3, versie 01/12/2025. De verwijzingen volgen de gedrukte paginanummers.</p><p>Dit zijn geen officiële examenvragen. De verdeling over de modules is een oefenkeuze, geen voorspelling van het echte examen.</p><p>Proefexamen: 40 vragen, 2 uur en een oefengrens van 75% (30/40). Eén punt per juist antwoord; een leeg of fout antwoord levert geen punt op.</p><p>De app kiest willekeurig uit een vaste vragenbank en husselt de antwoorden. Er worden tijdens het oefenen geen nieuwe AI-vragen gegenereerd.</p><p>De cursusversie bepaalt de leerstof. Controleer voor echte vluchten de actuele regels en <a href="https://map.droneguide.be/" target="_blank" rel="noopener">Droneguide</a>.</p><p><a href="cursus.pdf" target="_blank" rel="noopener">Open de broncursus</a> · <a href="https://www.easa.europa.eu/en/document-library/easy-access-rules/online-publications/easy-access-rules-unmanned-aircraft-systems?page=5" target="_blank" rel="noopener">EASA: examenopzet</a></p><p class="small muted">Voortgang en recente scores blijven alleen in deze browser bewaard.</p>`);
const drone=`<svg viewBox="0 0 360 250" fill="none" aria-hidden="true"><ellipse cx="180" cy="208" rx="100" ry="10" fill="#ead8c4"/><circle cx="180" cy="119" r="95" stroke="#dfb895" stroke-dasharray="4 8"/><path d="M45 175H315M180 15V229" stroke="#ead6c2" stroke-dasharray="3 7"/><path d="M150 105L101 72M210 105L259 72M150 131L101 164M210 131L259 164" stroke="#35281f" stroke-width="16" stroke-linecap="round"/><path d="M150 105L101 72M210 105L259 72M150 131L101 164M210 131L259 164" stroke="#ce7742" stroke-width="10" stroke-linecap="round"/><g stroke="#35281f" stroke-width="2.5" fill="#fffaf5"><ellipse cx="98" cy="69" rx="45" ry="13"/><ellipse cx="262" cy="69" rx="45" ry="13"/><ellipse cx="98" cy="166" rx="45" ry="13"/><ellipse cx="262" cy="166" rx="45" ry="13"/><rect x="145" y="88" width="70" height="61" rx="19" fill="#f5b079"/><rect x="164" y="138" width="32" height="24" rx="7"/><circle cx="180" cy="150" r="7" fill="#35281f"/></g><path d="M166 106H194M170 114H190" stroke="#a64c17" stroke-width="3" stroke-linecap="round"/><g fill="#b94708"><circle cx="98" cy="69" r="5"/><circle cx="262" cy="69" r="5"/><circle cx="98" cy="166" r="5"/><circle cx="262" cy="166" r="5"/></g></svg>`;
function home(){filter='all';app.innerHTML=`<section class="hero"><div><div class="eyebrow">Van cursus naar cockpit</div><h1>Test je kennis.<br><em>Vlieg met vertrouwen.</em></h1><p>Bereid je voor op A1/A3 met herkenbare situaties en duidelijke uitleg. Oefen op jouw tempo of probeer een volledig proefexamen.</p></div>${drone}</section>${session?`<div class="strip"><div><b>${session.done?'Je laatste sessie':'Je hebt nog een sessie openstaan'}</b><p>${session.mode==='exam'?'Proefexamen':'Oefenreeks'} · ${session.done?'afgerond':`${answered()} van ${session.questions.length} beantwoord${session.deadline?' · de timer loopt door':''}`}</p></div><button class="primary" id="resume">${session.done?'Bekijk resultaat':'Verdergaan'} →</button></div>`:''}<div class="cards"><section class="card featured"><div class="eyebrow">01 / Test jezelf</div><h2>Het proefexamen</h2><p class="muted">Een nieuwe mix uit alle negen modules. Je krijgt je score en uitleg nadat je indient.</p><div class="stats"><div><strong>40</strong><small>meerkeuzevragen</small></div><div><strong>2 uur</strong><small>tijd om na te denken</small></div><div><strong>75%</strong><small>oefengrens</small></div></div><button class="primary wide" id="exam">Start een proefexamen →</button></section><section class="card"><div class="eyebrow">02 / Leer stap voor stap</div><h2>Oefenen met uitleg</h2><p class="muted">Een korte reeks zonder tijdsdruk. Controleer je antwoord en ontdek meteen waarom het klopt.</p><div class="form"><label for="topic">Onderwerp</label><select id="topic"><option value="0">Alle modules</option>${modules.map((m,i)=>`<option value="${i+1}">${i+1}. ${m}</option>`).join('')}</select></div><button class="wide" id="practice">Start een oefenreeks →</button><p class="small muted" style="margin:10px 0 0">Tot 10 vragen · zonder timer · direct feedback</p></section></div><div class="sectionhead"><h2>Negen modules, één stevige basis</h2><span class="small muted">${bank.length} oefenvragen</span></div><div class="topics">${modules.map((m,i)=>`<button class="topic" data-topic="${i+1}"><span>0${i+1}</span><div>${m}<small>${bank.filter(q=>q.module===i+1).length} vragen · oefenen →</small></div></button>`).join('')}</div><div class="strip"><p><b>Leren begrijpen, niet alleen onthouden.</b><br>Elke uitleg verwijst naar de broncursus. Vragen en antwoorden worden telkens gehusseld.</p><span class="pill">BCAA · december 2025</span></div>${history.length?`<div class="sectionhead"><h2>Je recente resultaten</h2><button id="clear">Wis resultaten</button></div>${history.slice(0,5).map(h=>`<div class="historyrow"><span>${new Date(h.date).toLocaleDateString('nl-BE')} · ${h.mode==='exam'?'Proefexamen':'Oefenreeks'}</span><b>${h.score}/${h.total} · ${Math.round(100*h.score/h.total)}%</b></div>`).join('')}`:''}`;
$('exam').onclick=()=>requestStart('exam');$('practice').onclick=()=>requestStart('practice',+$('topic').value);document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>requestStart('practice',+b.dataset.topic));if($('resume'))$('resume').onclick=question;if($('clear'))$('clear').onclick=()=>{modal('<h2>Resultaten wissen?</h2><p>Je recente scores worden verwijderd. Je huidige sessie blijft bewaard.</p><div class="actions"><button class="primary" id="erase">Wis resultaten</button></div>');$('erase').onclick=()=>{history=[];save();$('dialog').close();home()}}}
function requestStart(mode,topic=0){if(session&&!session.done){modal('<h2>Nieuwe sessie starten?</h2><p>Je huidige sessie en de antwoorden daarin worden vervangen.</p><div class="actions"><button class="primary" id="replace">Start nieuwe sessie</button></div>');$('replace').onclick=()=>{$('dialog').close();start(mode,topic)}}else start(mode,topic)}
function start(mode,topic=0,custom=null){const picked=custom||(mode==='exam'?shuffle(quotas.flatMap((n,i)=>shuffle(bank.filter(q=>q.module===i+1)).slice(0,n))):shuffle(bank.filter(q=>!topic||q.module===topic)).slice(0,10));session={mode,questions:picked.map(q=>({id:q.id,order:shuffle([0,1,2,3])})),answers:{},flags:{},checked:{},index:0,started:Date.now(),deadline:mode==='exam'?Date.now()+7200000:null,done:false};filter='all';save();question();window.scrollTo(0,0)}
function answered(){return Object.keys(session.answers).length}
function current(){return bank.find(q=>q.id===session.questions[session.index].id)}
function feedback(q,a){return `<div class="feedback ${a===q.correct?'':'wrong'}" role="status"><b>${a===q.correct?'Juist!':a===undefined?'Niet beantwoord':'Nog niet juist'}</b><p>${q.explanation}</p><a href="cursus.pdf#page=${q.page+1}" target="_blank" rel="noopener">Lees na: module ${q.module}, cursuspagina ${q.page} ↗</a></div>`}
function question(){if(!session)return home();if(session.done)return results();if(expire())return;const q=current(),item=session.questions[session.index],a=session.answers[q.id],checked=!!session.checked[q.id];app.innerHTML=`<div class="examhead"><div><div class="eyebrow" style="margin-bottom:5px">${session.mode==='exam'?'Proefexamen':'Oefenreeks'} · A1/A3</div><h1>Een vraag. Eén beste antwoord.</h1></div><div class="timer" id="timer">${session.deadline?'02:00:00':'Geen timer'}</div></div><div class="work"><section class="card question"><div class="questiontop"><div class="eyebrow">Vraag ${session.index+1} / ${session.questions.length}<br><span class="muted" style="letter-spacing:.2px">${q.module}. ${modules[q.module-1]}</span></div><button id="flag" class="flag ${session.flags[q.id]?'on':''}" aria-pressed="${!!session.flags[q.id]}">${session.flags[q.id]?'★ Gemarkeerd':'☆ Even onthouden'}</button></div><h2 id="questionTitle" tabindex="-1">${q.question}</h2><div class="options" role="group" aria-label="Antwoorden">${item.order.map((o,i)=>`<button class="option ${a===o?'selected':''} ${checked&&o===q.correct?'good':''} ${checked&&a===o&&a!==q.correct?'bad':''}" data-answer="${o}" aria-pressed="${a===o}" ${checked?'disabled':''}><span class="letter">${'ABCD'[i]}</span><span>${q.options[o]}${checked&&o===q.correct?' <b>✓ Juist antwoord</b>':''}${checked&&a===o&&a!==q.correct?' <b>✕ Jouw antwoord</b>':''}</span></button>`).join('')}</div>${session.mode==='practice'?checked?feedback(q,a):`<button class="primary" id="check" style="margin-top:20px" ${a===undefined?'disabled':''}>Controleer antwoord</button>`:''}<div class="nav"><button id="prev" ${session.index===0?'disabled':''}>← Vorige</button><button id="next" class="${session.index===session.questions.length-1?'primary':''}">${session.index===session.questions.length-1?'Afronden':'Volgende →'}</button></div></section><aside class="card"><h3>Jouw voortgang</h3><span class="small muted">${answered()} van ${session.questions.length} beantwoord</span><div class="progress"><i style="width:${100*answered()/session.questions.length}%"></i></div><div class="grid">${session.questions.map((x,i)=>`<button data-jump="${i}" class="${session.answers[x.id]!==undefined?'answered':''} ${i===session.index?'current':''} ${session.flags[x.id]?'marked':''}" aria-label="Vraag ${i+1}, ${session.answers[x.id]!==undefined?'beantwoord':'onbeantwoord'}${session.flags[x.id]?', gemarkeerd':''}" ${i===session.index?'aria-current="step"':''}>${i+1}</button>`).join('')}</div><p class="small muted">Oranje = beantwoord<br>• = nog eens bekijken</p><button class="primary wide" id="finish">${session.mode==='exam'?'Examen indienen':'Oefenreeks afronden'}</button><button class="wide" id="back" style="margin-top:9px">Naar startpagina</button><p class="small muted" style="margin:15px 0 0">${session.mode==='exam'?'Je mag teruggaan en antwoorden wijzigen. De timer loopt door als je deze pagina sluit.':'Controleer je antwoord voor uitleg. Daarna staat dat antwoord vast.'}</p></aside></div>`;
document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(expire())return;session.answers[q.id]=+b.dataset.answer;save();question()});$('flag').onclick=()=>{if(expire())return;session.flags[q.id]=!session.flags[q.id];save();question()};$('prev').onclick=()=>go(session.index-1);$('next').onclick=()=>session.index===session.questions.length-1?confirmFinish():go(session.index+1);document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>go(+b.dataset.jump));if($('check'))$('check').onclick=()=>{session.checked[q.id]=true;save();question()};$('finish').onclick=confirmFinish;$('back').onclick=home;tick()}
function go(i){if(expire())return;session.index=i;save();question();$('questionTitle')?.focus();window.scrollTo({top:0,behavior:'smooth'})}
function confirmFinish(){if(expire())return;const n=session.questions.length-answered(),f=Object.values(session.flags).filter(Boolean).length;modal(`<h2>Sessie indienen?</h2><p>${n?`Je hebt nog <b>${n} onbeantwoorde vragen</b>. Die leveren geen punten op.`:'Je hebt alle vragen beantwoord.'}</p>${f?`<p>${f} vragen zijn gemarkeerd om opnieuw te bekijken.</p>`:''}<p>Na indienen kun je je antwoorden niet meer wijzigen.</p><div class="actions"><button id="confirmFinish" class="primary">Indienen en resultaat bekijken</button></div>`);$('confirmFinish').onclick=()=>{$('dialog').close();finish(false)}}
function finish(timedOut){if(!session||session.done)return;session.done=true;session.timedOut=timedOut;session.finished=Date.now();const score=session.questions.filter(x=>session.answers[x.id]===bank.find(q=>q.id===x.id).correct).length;history.unshift({date:Date.now(),mode:session.mode,score,total:session.questions.length});history=history.slice(0,20);save();if($('dialog').open)$('dialog').close();results();window.scrollTo(0,0)}
function expire(){if(session&&!session.done&&session.deadline&&Date.now()>=session.deadline){finish(true);return true}return false}
function tick(){if(expire())return;if(session&&!session.done&&session.deadline&&$('timer')){const s=Math.max(0,Math.ceil((session.deadline-Date.now())/1000));$('timer').textContent=[Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(n=>String(n).padStart(2,'0')).join(':');$('timer').classList.toggle('urgent',s<600)}}
function results(){const qs=session.questions.map(x=>bank.find(q=>q.id===x.id)),score=qs.filter(q=>session.answers[q.id]===q.correct).length,pct=Math.round(score/qs.length*100),wrong=qs.filter(q=>session.answers[q.id]!==q.correct);app.innerHTML=`<div class="eyebrow">${session.mode==='exam'?'Proefexamen':'Oefenreeks'} · Jouw resultaat</div><div class="resultshero"><div class="score">${pct}%<small>${score} van ${qs.length} juist</small></div><div><h1>${session.mode==='exam'?(pct>=75?'Oefengrens behaald.':'Je weet waar je kunt groeien.'):'Weer een stap verder.'}</h1><p class="muted">${session.timedOut?'De twee uur zijn voorbij. Je antwoorden zijn automatisch ingediend.':session.mode==='exam'?'De oefengrens is 30 van de 40 juiste antwoorden.':'Bekijk de uitleg en oefen wat nog lastig is.'}<br>Dit resultaat is geen officieel certificaat.</p></div></div><div class="actions"><button class="primary" id="again">Nieuw proefexamen →</button>${wrong.length?'<button id="retry">Oefen mijn fouten</button>':''}<button id="back">Naar startpagina</button></div><div class="card" style="margin-top:28px"><h2>Waar sta je per module?</h2>${modules.map((m,i)=>{const group=qs.filter(q=>q.module===i+1);if(!group.length)return '';const n=group.filter(q=>session.answers[q.id]===q.correct).length;return `<div class="modulebar"><span>${i+1}. ${m}</span><b>${n} / ${group.length}</b></div><div class="progress"><i style="width:${100*n/group.length}%"></i></div>`}).join('')}</div><div class="review"><div class="sectionhead"><h2>Bekijk je antwoorden</h2><label class="small">Toon <select id="filter"><option value="all">Alle vragen</option><option value="wrong" ${filter==='wrong'?'selected':''}>Fout of onbeantwoord</option></select></label></div>${qs.map((q,i)=>{const a=session.answers[q.id],ok=a===q.correct;if(filter==='wrong'&&ok)return '';return `<details><summary><span class="status ${ok?'':'wrong'}">${ok?'✓ Juist':a===undefined?'— Leeg':'✕ Fout'}</span>${i+1}. ${q.question}</summary><p style="margin-top:15px"><b>Jouw antwoord:</b> ${a===undefined?'Niet beantwoord':q.options[a]}</p>${!ok?`<p><b>Juist antwoord:</b> ${q.options[q.correct]}</p>`:''}${feedback(q,a)}</details>`}).join('')}${filter==='wrong'&&!wrong.length?'<p>Alle antwoorden zijn juist.</p>':''}</div>`;$('again').onclick=()=>start('exam');if($('retry'))$('retry').onclick=()=>start('practice',0,shuffle(wrong));$('back').onclick=home;$('filter').onchange=e=>{filter=e.target.value;results()}}
function validSession(s){return s&&['exam','practice'].includes(s.mode)&&Array.isArray(s.questions)&&s.questions.length>0&&Number.isInteger(s.index)&&s.index>=0&&s.index<s.questions.length&&s.answers&&s.flags&&s.checked&&s.questions.every(x=>bank.some(q=>q.id===x.id)&&Array.isArray(x.order)&&[...x.order].sort().join(',')==='0,1,2,3')&&(s.mode!=='exam'||Number.isFinite(s.deadline))}

const BANKKEY='a1a3-bank-json-v1';
const esc=s=>s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');
function validateBank(data){
 if(!Array.isArray(data)||data.length>5000)throw Error('Het bestand moet een JSON-lijst met maximaal 5000 vragen bevatten.');
 const ids=new Set(),counts=Array(9).fill(0);
 data.forEach((q,i)=>{
  const fail=message=>{throw Error(`Vraag ${i+1}: ${message}`)};
  if(!q||typeof q!=='object')fail('geen geldig vraagobject.');
  if(!Number.isSafeInteger(q.id)||q.id<1||ids.has(q.id))fail('id moet een uniek positief geheel getal zijn.');ids.add(q.id);
  if(!Number.isInteger(q.module)||q.module<1||q.module>9)fail('module moet 1 tot en met 9 zijn.');
  for(const k of ['question','explanation'])if(typeof q[k]!=='string'||!q[k].trim()||q[k].length>5000)fail(`${k} moet tekst van 1 tot 5000 tekens bevatten.`);
  if(!Array.isArray(q.options)||q.options.length!==4||q.options.some(v=>typeof v!=='string'||!v.trim()||v.length>2000)||new Set(q.options.map(v=>v.trim())).size!==4)fail('options moet vier verschillende, niet-lege antwoorden bevatten.');
  if(!Number.isInteger(q.correct)||q.correct<0||q.correct>3)fail('correct moet 0, 1, 2 of 3 zijn.');
  if(!Number.isInteger(q.page)||q.page<1||q.page>98)fail('page moet een cursuspagina van 1 tot en met 98 zijn.');
  counts[q.module-1]++;
 });
 const missing=counts.map((n,i)=>n<quotas[i]?`${modules[i]}: minimaal ${quotas[i]} (nu ${n})`:null).filter(Boolean);
 if(missing.length)throw Error('Te weinig vragen voor een volledig proefexamen. '+missing.join('; '));
 return data.map(q=>({id:q.id,module:q.module,page:q.page,question:q.question,options:q.options,correct:q.correct,explanation:q.explanation}));
}
function activate(data,restore=false){
 bank=data.map(q=>({...q,question:esc(q.question),options:q.options.map(esc),explanation:esc(q.explanation)}));
 if(restore){const h=read(HKEY);history=Array.isArray(h)?h.filter(x=>x&&Number.isFinite(x.score)&&Number.isFinite(x.total)&&Number.isFinite(x.date)):[];const s=read(KEY);session=validSession(s)?s:null}
 else{session=null;history=[];try{localStorage.setItem(BANKKEY,JSON.stringify(data))}catch{}save()}
 $('bankStatus').textContent=`${bank.length} vragen geladen`;if(!expire())home();
}
async function loadQuestions(){
 app.innerHTML='<p role="status">Vragen laden…</p>';
 $('bankStatus').textContent='Vragen laden…';
 try{
  const response=await fetch('./vragen.json',{cache:'no-store'});
  if(!response.ok)throw Error('Vragenbestand niet beschikbaar (HTTP '+response.status+').');
  const text=await response.text();
  if(text.length>5*1024*1024)throw Error('Het vragenbestand is te groot (maximaal 5 MB).');
  let raw;try{raw=JSON.parse(text.replace(/^\uFEFF/,''))}catch{throw Error('vragen.json bevat geen geldige JSON.');}
  const data=validateBank(raw),previous=read(BANKKEY);
  const same=previous&&JSON.stringify(previous)===JSON.stringify(data);
  activate(data,!!same);
  if(previous&&!same){const notice=document.createElement('p');notice.className='small muted';notice.textContent='De vragenbank is bijgewerkt. Je vorige sessie en resultaten zijn opnieuw ingesteld.';app.prepend(notice)}
 }catch(error){
  $('bankStatus').textContent='Laden mislukt';
  app.innerHTML='<section class="card"><h1>De vragen konden niet laden.</h1><p role="alert">'+esc(error.message)+'</p><p>Controleer of vragen.json naast index.html op de server staat en bereikbaar is.</p><button class="primary" id="reloadQuestions">Opnieuw proberen</button></section>';
  $('reloadQuestions').onclick=loadQuestions;
 }
}
loadQuestions();
setInterval(tick,500);
</script></body></html>
